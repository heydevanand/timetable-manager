{% extends 'base.html' %}

{% block title %}Edit Teacher - Timetable Manager{% endblock %}

{% block content %}
<div class="fade-in">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="{{ url_for('index') }}">Teachers</a></li>
            <li class="breadcrumb-item active">Edit {{ teacher.name }}</li>
        </ol>
    </nav>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card">
                <div class="card-header gradient-header">
                    <h5 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Edit Teacher</h5>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('edit_teacher', id=teacher.id) }}" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Teacher Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ teacher.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <input type="text" class="form-control" id="department" name="department" value="{{ teacher.department or '' }}" list="deptList">
                            <datalist id="deptList">
                                {% for dept in departments %}
                                <option value="{{ dept }}">
                                {% endfor %}
                            </datalist>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ teacher.email or '' }}">
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-semibold">Phone</label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ teacher.phone or '' }}">
                        </div>

                        <div class="d-flex justify-content-between mt-4">
                            <a href="{{ url_for('index') }}" class="btn btn-secondary"><i class="bi bi-arrow-left me-1"></i>Cancel</a>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Update Teacher</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
